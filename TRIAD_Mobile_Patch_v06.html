function weapon(id){return {id,level:1,dmg:0,speed:0,cdr:0,aoe:0,cd:0,timer:rnd(.2,1),awake:false,ultimate:false,x:null,y:null,rot:0,variant:0};}
function makeDecor(){decor=[];let seed=103;const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};for(let i=0;i<185;i++){let x=rand()*1770+15,y=rand()*1050+20,b=biomeAt(x);if(Math.abs(x-(b*600+300))<95&&Math.abs(y-300)<90)continue;decor.push({x,y,b,h:8+rand()*26,type:rand()});}}
function startRun(stage){selectedStage=stage;game={stage,st:STAGES[stage],time:0,runGold:0,kills:0,xp:0,points:0,regularKills:0,awakeningTokens:0,claimedIds:[0,1,3],rewardSerial:0,claim:null,dashUp:0,p:{x:300,y:530,hp:config.playerHP,mp:config.playerMP,inv:0,parry:0,dashCD:0,faceX:1,faceY:0,anim:0},weapons:[weapon(0),weapon(1),weapon(3)],active:0,enemies:[],shots:[],hazards:[],effects:[],texts:[],biomes:BIOMES.map(()=>({kills:0,spawned:0,spawnClock:0,wardenSpawned:false,wardenDead:false,visited:false,reward:false,quest:false})),pendingPick:[],raid:false,raidDone:false,boss:null,raidTime:0,combo:0,settled:false,stats:{damageDealt:0,damageTaken:0,parries:0,dashes:0,crits:0,enemyDodges:0,playerDodges:0},log:[],startAt:new Date().toISOString()};mode='play';makeDecor();$('hud').style.display='block';nav={x:300,y:300};packScreen('start');updateHUD();}
function shapes(w){let s=DEF[w.id].shape.map(([x,y])=>[x,y]);for(let i=0;i<((w.rot||0)%4);i++){let my=Math.max(...s.map(c=>c[1]));s=s.map(([x,y])=>[my-y,x]);}let minX=Math.min(...s.map(c=>c[0])),minY=Math.min(...s.map(c=>c[1]));return s.map(([x,y])=>[x-minX,y-minY]);}
function canPlace(w,x,y){let cells=shapes(w).map(([a,b])=>[x+a,y+b]);if(cells.some(([a,b])=>a<0||b<0||a>=8||b>=6))return false;return !game.weapons.some(o=>o!==w&&o.x!==null&&shapes(o).some(([a,b])=>cells.some(([c,d])=>o.x+a===c&&o.y+b===d)));}
function allPacked(){return game.weapons.every(w=>w.x!==null);}
function displayName(w){return w.ultimate?DEF[w.id].ultimate:DEF[w.id].name;}
function weaponStats(w){return `Lv ${w.level}/${config.levelCap}${w.ultimate?' · ULTIMATE':w.awake?' · AWAKENED':''}`;}
function linkedBiome(id){return id===0||id===3?0:id===1||id===4?1:2;}
function packScreen(reason='manage'){modal='bag';pack={reason,selected:game.claim?.id??game.weapons.find(w=>w.x===null)?.id??game.weapons[0].id};renderPack();}
function renderPack(){let chosen=game.weapons.find(w=>w.id===pack.selected);show(`<div class="row"><div><div class="eyebrow">▣ ${game.weapons.length}/6 · ✧ ${game.combo}/3</div><h2>${pack.reason==='start'?'Pack three':'Backpack'}</h2></div><span class="muted">Select → place</span></div><div class="bagLayout"><div><div id="bagGrid"></div><div class="row" style="margin-top:10px"><button id="rotate">↻ ${chosen.rot*90}°</button><button id="unpack">↥ Lift</button><span id="bagStatus" class="muted">${allPacked()?'✓ Ready':'▣ Place every piece'}</span></div><div class="bagExample">${weaponArt(chosen.id,chosen.rot)}<span>↻ 90°<br>→ tap grid</span></div></div><div><div id="items">${[...game.weapons].sort((a,b)=>a.id-b.id).map(w=>`<button class="itemBtn ${w.id===pack.selected?'selected':''}" id="item${w.id}">${weaponArt(w.id,w.rot)}<span>${typeBadge(w.id)}<br>${displayName(w)} <small>L${w.level}${w.awake?' ✦':''} · ${w.x===null?'unplaced':'✓'}</small></span></button>`).join('')}</div><div class="selectedDetail">${typeBadge(chosen.id)} ${DEF[chosen.id].desc}<br><span class="muted">${variantOf(chosen).name} · ${variantOf(chosen).desc}</span></div><div id="fusionList"></div><div class="buttons"><button class="primary" id="packDone" ${allPacked()?'':'disabled'}>${pack.reason==='start'?'BEGIN →':'DONE →'}</button>${game.claim?'<button id="cancelClaim">↶ Choose again / Later</button>':''}</div></div></div>`);
let grid=$('bagGrid');for(let y=0;y<6;y++)for(let x=0;x<8;x++){let owner=game.weapons.find(w=>w.x!==null&&shapes(w).some(([a,b])=>w.x+a===x&&w.y+b===y)),cell=document.createElement('div');cell.className='cell'+(owner?' occupied':'')+(owner&&owner.id===pack.selected?' selected':'');cell.dataset.x=x;cell.dataset.y=y;if(owner){cell.style.background=owner.id===pack.selected?'#605237':DEF[owner.id].color+'44';let s=shapes(owner);if(x===owner.x+s[0][0]&&y===owner.y+s[0][1])cell.textContent=DEF[owner.id].short.slice(0,3);}grid.appendChild(cell);}
let down=null;grid.onpointerdown=e=>{e.preventDefault();let cell=e.target.closest('.cell');if(!cell)return;let x=+cell.dataset.x,y=+cell.dataset.y,owner=game.weapons.find(w=>w.x!==null&&shapes(w).some(([a,b])=>w.x+a===x&&w.y+b===y));if(owner){pack.selected=owner.id;down={id:owner.id,sx:e.clientX,sy:e.clientY,ox:x-owner.x,oy:y-owner.y};}else placeSelected(x,y);};grid.onpointerup=e=>{if(!down)return;let c=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell');if(c&&len(e.clientX-down.sx,e.clientY-down.sy)>8){let w=game.weapons.find(w=>w.id===down.id),x=+c.dataset.x-down.ox,y=+c.dataset.y-down.oy;if(canPlace(w,x,y)){w.x=x;w.y=y;}else tone(120);}down=null;renderPack();};grid.onpointercancel=()=>down=null;
game.weapons.forEach(w=>btn('item'+w.id,()=>{pack.selected=w.id;renderPack()}));btn('rotate',()=>{let w=game.weapons.find(w=>w.id===pack.selected);w.rot=(w.rot+1)%4;if(w.x!==null&&!canPlace(w,w.x,w.y)){w.x=w.y=null;notify('↻ Rotated · place again');}renderPack();});btn('unpack',()=>{let w=game.weapons.find(w=>w.id===pack.selected);w.x=w.y=null;renderPack();});btn('packDone',()=>{if(!allPacked())return;finalizeClaim();let first=pack.reason==='start';closeModal();pack=null;if(first)notify('◇ Follow the beacon');processPending();});btn('cancelClaim',cancelClaim);
$('fusionList').innerHTML=[0,1,2].map(id=>{let a=game.weapons.find(w=>w.id===id),p=game.weapons.find(w=>w.id===DEF[id].pair),ok=a&&p&&a.awake&&p.awake&&!a.ultimate&&!game.claim;return a&&!a.ultimate?`<button class="itemBtn small" id="fuse${id}" ${ok?'':'disabled'}>${weaponArt(id)}<span>✦ + ✦ → ${DEF[id].ultimate}</span></button>`:'';}).join('');[0,1,2].forEach(id=>btn('fuse'+id,()=>fuse(id)));}
function placeSelected(x,y){let w=game.weapons.find(w=>w.id===pack.selected);if(canPlace(w,x,y)){w.x=x;w.y=y;tone(570);renderPack();}else{$('bagStatus').textContent='× No space · rotate or lift';tone(130);}}
function fuse(id){let a=game.weapons.find(w=>w.id===id),p=game.weapons.find(w=>w.id===DEF[id].pair);if(!a||!p||!a.awake||!p.awake||a.ultimate||game.combo>=3||game.claim)return;a.ultimate=true;a.dmg+=p.dmg*.6;a.speed+=p.speed*.4;a.aoe+=p.aoe*.5;game.weapons=game.weapons.filter(w=>w!==p);game.combo++;game.log.push(`Fused ${DEF[id].ultimate}`);tone(880,.25);renderPack();updateHUD();}
function processPending(){/* Rewards wait for a deliberate player tap. */}
function awaken(){if(game)updateHUD();}
function awakenWeapon(id){let w=game?.weapons.find(w=>w.id===id);if(!w||w.awake||w.level<config.levelCap||game.awakeningTokens<1)return;game.awakeningTokens--;w.awake=true;game.log.push(`Player spent awakening seal on ${DEF[id].name}`);tone(800,.16);notify(`✦ ${DEF[id].name}`);upgradeScreen();}
function upgradeScreen(){if(!game||mode!=='play')return;modal='upgrade';let oldScroll=$('overlay').querySelector('.panel')?.scrollTop||0;show(`<div class="row"><div><div class="eyebrow">UPGRADES / PAUSED</div><h2>↑ ${game.points} <span class="sealCount">✦ ${game.awakeningTokens}</span></h2></div><button class="primary" id="upDone">DONE →</button></div><div class="workLegend"><span>↑ 1 point = 1 level</span><span>✦ 1 seal = chosen max-level weapon</span></div><div class="cards">${[...game.weapons].sort((a,b)=>a.id-b.id).map(w=>`<div class="card upgradeCard">${weaponArt(w.id)}${typeBadge(w.id)}<h3>${displayName(w)}</h3><div class="row"><span>L${w.level}/${config.levelCap}</span><span>${w.awake?'✦ Awakened':variantOf(w).name}</span></div><div class="bar"><i style="width:${w.level/config.levelCap*100}%;background:${w.id<3?'#74cfff':'#d5a2ff'}"></i></div><div class="upgradeActions">${['dmg','speed',w.id<3?'cdr':'aoe'].map(t=>`<button class="small" id="buy_${w.id}_${t}" ${game.points<1||w.level>=config.levelCap?'disabled':''}>${t==='dmg'?'⚔ Damage':t==='speed'?'⚡ Attack speed':t==='cdr'?'◷ Cooldown':'◎ Area'} <span>↑ 1</span></button>`).join('')}<button class="awakenBtn small" id="awaken_${w.id}" ${w.awake||w.level<config.levelCap||game.awakeningTokens<1?'disabled':''}>${w.awake?'✓ Awakened':w.level<config.levelCap?'✦ Reach level '+config.levelCap:'✦ Awaken this weapon'} ${w.awake?'':'· 1 seal'}</button></div></div>`).join('')}<div class="card"><h3>➤ Dash · ${game.dashUp}/3</h3><p>+${config.dashUpgrade} px</p><button id="buyDash" ${game.points<1||game.dashUp>=3?'disabled':''}>Distance + · ↑ 1</button></div></div><button id="upDone2">DONE →</button>`);$('overlay').querySelector('.panel').scrollTop=oldScroll;for(let w of game.weapons){for(let t of ['dmg','speed',w.id<3?'cdr':'aoe'])btn(`buy_${w.id}_${t}`,()=>{if(game.points<1||w.level>=config.levelCap)return;w[t]++;w.level++;game.points--;tone(620);upgradeScreen();updateHUD();});btn('awaken_'+w.id,()=>awakenWeapon(w.id));}btn('buyDash',()=>{if(game.points<1||game.dashUp>=3)return;game.dashUp++;game.points--;upgradeScreen();});let done=()=>{closeModal();updateHUD();};btn('upDone',done);btn('upDone2',done);}
function grantWeaponReward(b){let r={uid:++game.rewardSerial,biome:b,rerolls:config.weaponRerolls,generation:0,offers:null};game.pendingPick.push(r);game.log.push(`${BIOMES[b].name} weapon claim stored`);}
function buildOffers(r){let ids=DEF.map((_,i)=>i).filter(id=>!game.claimedIds.includes(id));if(!ids.length){r.offers=[];return;}let before=r.offers?.map(o=>o.id+':'+o.variant).sort().join('|');for(let attempt=0;attempt<10;attempt++){let pool=ids.flatMap(id=>VARIANTS.map((_,variant)=>({id,variant}))).sort(()=>Math.random()-.5),out=[];if(ids.length>=3){let shuffled=[...ids].sort(()=>Math.random()-.5);out=shuffled.slice(0,3).map(id=>pool.find(o=>o.id===id));}else {if(ids.length===2)out=ids.map(id=>pool.find(o=>o.id===id));for(let o of pool)if(!out.some(x=>x.id===o.id&&x.variant===o.variant)){out.push(o);if(out.length===3)break;}}if(out.map(o=>o.id+':'+o.variant).sort().join('|')!==before||attempt===9){if(attempt===9&&out.map(o=>o.id+':'+o.variant).sort().join('|')===before){let first=out[0],alts=VARIANTS.map((_,i)=>i).filter(i=>!out.some(o=>o.id===first.id&&o.variant===i));out[0]={id:first.id,variant:alts[0]};}r.offers=out;break;}}}
function weaponChoiceScreen(){if(!game||mode!=='play')return;if(game.claim){packScreen('pickup');return;}let r=game.pendingPick[0];if(!r){notify('▣ No stored weapon rewards');return;}if(!r.offers)buildOffers(r);modal='weaponChoice';show(`<div class="row"><div><div class="eyebrow">▣ WEAPON REWARD · ${game.pendingPick.length} STORED</div><h2>Choose one</h2></div><button id="choiceLater">Later →</button></div><div class="cards weaponOffers">${r.offers.map((o,i)=>`<button class="card" id="offer${i}">${weaponArt(o.id)}${typeBadge(o.id)}<h3>${DEF[o.id].name}</h3><div class="variantName">${VARIANTS[o.variant].name}</div><p>${VARIANTS[o.variant].desc}</p><div class="offerEffect">${o.id===0?'⌒ Slash':o.id===1?'➶ Piercing bolts':o.id===2?'◎ Blast':o.id===3?'⟳ Close pulses':o.id===4?'➶ Auto bolts':'◎ Damage field'}</div><span class="pickLabel">SELECT → PACK</span></button>`).join('')}</div><div class="row"><button id="reroll" ${r.rerolls<1?'disabled':''}>⟳ Reroll · ${r.rerolls} left</button><span class="muted">${r.offers.length?'One per slot · last slot offers build variants':'All six acquired'}</span></div><details style="margin-top:12px"><summary>Build stats</summary><div class="muted">Balanced: no modifier. Heavy: +22% damage, 10% slower cadence and longer active cooldown. Swift: −10% damage, +18% cadence and 10% shorter active cooldown. Wide: −10% damage, +25% passive radius / mortar blast / saber reach; wider piercing bow bolts, 5% shorter active cooldown. Every reroll refreshes all three cards. Closing this window preserves the cards and remaining rerolls.</div></details>`);btn('choiceLater',()=>closeModal());btn('reroll',()=>{if(r.rerolls<1)return;r.rerolls--;r.generation++;buildOffers(r);weaponChoiceScreen();tone(450);});r.offers.forEach((o,i)=>btn('offer'+i,()=>{if(game.claimedIds.includes(o.id)||game.weapons.length>=6)return;let w=weapon(o.id);w.variant=o.variant;game.claim={id:o.id,rewardUid:r.uid,oldLayout:game.weapons.map(w=>({id:w.id,x:w.x,y:w.y,rot:w.rot}))};game.weapons.push(w);packScreen('pickup');}));}
function finalizeClaim(){let c=game.claim;if(!c)return;game.claimedIds.push(c.id);game.pendingPick=game.pendingPick.filter(r=>r.uid!==c.rewardUid);game.log.push(`Claimed ${DEF[c.id].name} / ${variantOf(game.weapons.find(w=>w.id===c.id)).name}`);game.claim=null;}
function cancelClaim(){let c=game.claim;if(!c)return;game.weapons=game.weapons.filter(w=>w.id!==c.id);for(let s of c.oldLayout){let w=game.weapons.find(w=>w.id===s.id);if(w)Object.assign(w,{x:s.x,y:s.y,rot:s.rot});}game.claim=null;weaponChoiceScreen();}

function giveXP(amount=1){game.xp+=amount;while(game.xp>=config.killsPerUpgrade){game.xp-=config.killsPerUpgrade;game.points++;notify('↑ +1 stored');}}
function questUpdate(b){let z=game.biomes[b];if(!z.quest&&z.visited&&z.wardenDead&&z.kills>=config.tallyTarget){z.quest=true;game.points+=config.questUpgradePoints;game.awakeningTokens+=config.questAwakeningSeals;game.p.hp=Math.min(config.playerHP,game.p.hp+35);game.log.push(`${BIOMES[b].name} quest cleared at ${game.time.toFixed(1)}s`);notify(`✓ ${BIOMES[b].name} · ↑ +${config.questUpgradePoints} · ✦ +${config.questAwakeningSeals}`);}}
function killEnemy(e){if(e.dead)return;e.dead=true;game.kills++;game.stats.damageDealt+=0;burst(e.x,e.y,e.boss?'#ffcb7e':BIOMES[e.biome].color,e.boss?20:7);if(e.final){game.runGold+=Math.round(config.goldPerBoss*(1+meta.bounty*.15));game.raidDone=true;victory();return;}if(e.boss){let z=game.biomes[e.biome];z.wardenDead=true;game.runGold+=Math.round(config.goldPerWarden*(1+meta.bounty*.15));questUpdate(e.biome);if(!z.quest)notify(`♜ ${BIOMES[e.biome].name} sentinel ✓`);}else{let z=game.biomes[e.biome];z.kills++;game.runGold+=config.goldPerKill;game.regularKills++;giveXP(1);if(z.kills>=config.tallyTarget&&!z.reward){z.reward=true;grantWeaponReward(e.biome);notify(`▣ ${BIOMES[e.biome].name} reward stored`);}questUpdate(e.biome);}tone(e.boss?220:430,.04,.5);}
function hurtEnemy(e,d,canDodge=true){if(e.dead)return;if(canDodge&&!e.boss&&Math.random()<config.enemyDodge){game.stats.enemyDodges++;text(e.x,e.y,'DODGE','#aab9c7');return;}let crit=Math.random()<config.critRate;if(crit){d*=config.critMultiplier;game.stats.crits++;}e.hp-=d;game.stats.damageDealt+=d;e.flash=.1;text(e.x+rnd(-8,8),e.y,Math.round(d)+(crit?'!':''),crit?'#ffe48f':'#d7f7ff');if(e.hp<=0)killEnemy(e);}
function hurtPlayer(d,source){if(!game||mode!=='play')return;let p=game.p;if(p.inv>0)return;if(Math.random()<config.playerDodge){game.stats.playerDodges++;text(p.x,p.y,'EVADE','#a4d8f0');return;}p.hp-=d;p.inv=config.damageInvulnerability;game.stats.damageTaken+=d;burst(p.x,p.y,'#ff6a86',6);tone(105,.1);if(p.hp<=0){p.hp=0;defeat('You fell in battle.');}}
function text(x,y,t,c){game.texts.push({x,y,t,c,life:.8});}function burst(x,y,c,n){for(let i=0;i<n;i++)game.effects.push({x,y,vx:rnd(-70,70),vy:rnd(-70,70),c,life:rnd(.2,.5),size:rnd(2,5)});}
function damageArea(x,y,r,d){for(let e of [...game.enemies])if(!e.dead&&len(e.x-x,e.y-y)<r+e.r)hurtEnemy(e,d);burst(x,y,'#8cead4',7);game.effects.push({x,y,c:'#85e8d9',life:.22,max:.22,ring:r});}
function nearest(range=1000){let p=game.p,best=null,bd=range;for(let e of game.enemies){if(!e.dead&&dist(e,p)<bd){best=e;bd=dist(e,p);}}return best;}
function damage(w){return config.attackDamage*(1+w.dmg*config.weaponDamageGain)*(w.awake?1.45:1)*(w.ultimate?1.65:1)*variantOf(w).damage;}
function cooldown(w){return DEF[w.id].cd*config.activeCooldown*Math.max(.2,1-w.cdr*config.weaponCDRGain)*variantOf(w).cooldown/(config.attackSpeed*(1+w.speed*config.weaponSpeedGain)*variantOf(w).rate);}
function addShot(x,y,dx,dy,speed,dmg,color,opts={}){let l=len(dx,dy)||1;game.shots.push({x,y,vx:dx/l*speed,vy:dy/l*speed,dmg,c:color,r:5,life:3,enemy:false,pierce:0,hit:new Set(),...opts});}
function shootBow(w,e,passive=false){let p=game.p,d=damage(w),shots=passive?1:1+Math.floor(w.speed*config.weaponSpeedGain*4)+(w.ultimate?2:0);for(let i=0;i<shots;i++){let a=Math.atan2(e.y-p.y,e.x-p.x)+(i-(shots-1)/2)*.11;addShot(p.x,p.y,Math.cos(a),Math.sin(a),360*(1+w.speed*.08),d*(passive?.8:1.15),DEF[w.id].color,{pierce:(w.ultimate?6:2)+(variantOf(w).area>1?1:0),r:5*variantOf(w).area});}}
function fireWeapon(){if(!game||modal||mode!=='play')return;let w=game.weapons.find(w=>w.id===game.active);if(!w||w.id>=3||w.cd>0)return;let p=game.p,cost=config.manaCost*DEF[w.id].mp;if(p.mp<cost){if(game.time>(game.manaNotice||0)){notify('Low MP. Keep moving while it regenerates.');game.manaNotice=game.time+3;}return;}let target=nearest(w.id===0?190:800);if(!target)return;p.mp-=cost;w.cd=cooldown(w);p.anim=.2;let d=damage(w),speedHits=1+w.speed*config.weaponSpeedGain;
if(w.id===0){let r=(w.ultimate?160:112)*(w.awake?1.15:1)*variantOf(w).area;let angle=Math.atan2(target.y-p.y,target.x-p.x);game.effects.push({x:p.x,y:p.y,c:w.ultimate?'#ffe8a1':'#a3e6ff',life:.24,max:.24,slash:r,angle});for(let e of [...game.enemies])if(!e.dead&&dist(e,p)<r+e.r){let a=Math.atan2(e.y-p.y,e.x-p.x)-angle;if(Math.cos(a)>-.35)hurtEnemy(e,d*1.6*speedHits);}if(w.ultimate)damageArea(p.x,p.y,70,d*.45);}
if(w.id===1){shootBow(w,target);if(w.ultimate)damageArea(p.x,p.y,70,d*.4);}
if(w.id===2){let n=1+Math.floor(w.speed*config.weaponSpeedGain*3)+(w.ultimate?2:0);for(let i=0;i<n;i++){let tx=clamp(target.x+rnd(-30,30),20,1780),ty=clamp(target.y+rnd(-30,30),20,1080);game.hazards.push({type:'blast',x:tx,y:ty,r:(w.ultimate?115:85)*variantOf(w).area,delay:.42+i*.12,life:.3,dmg:d*2.5,enemy:false,color:'#c49bff',resolved:false});}}
tone([480,690,180][w.id],.07);}
function dash(){if(!game||modal||mode!=='play')return;let p=game.p;if(p.dashCD>0||p.dashLeft>0)return;let dx=joy.x,dy=joy.y;if(len(dx,dy)<.12){dx=p.faceX;dy=p.faceY;}let l=len(dx,dy)||1;dx/=l;dy/=l;let distance=config.dashDistance+game.dashUp*config.dashUpgrade,duration=Math.max(.06,config.dashDuration);p.dashLeft=duration;p.dashVX=dx*distance/duration;p.dashVY=dy*distance/duration;p.faceX=dx;p.faceY=dy;p.inv=Math.max(p.inv,config.dashInvulnerability);p.parry=config.parryWindow;p.dashCD=config.dashCooldown;game.stats.dashes++;game.effects.push({x:p.x,y:p.y,c:'#a9eeff',life:.25,max:.25,ring:20});tone(790,.05);}
function parry(source){let p=game.p;game.stats.parries++;p.mp=Math.min(config.playerMP,p.mp+22);p.inv=Math.max(p.inv,.35);p.parry=0;text(p.x,p.y,'PARRY','#ffe095');burst(p.x,p.y,'#ffe095',16);game.effects.push({x:p.x,y:p.y,c:'#ffe095',life:.35,max:.35,ring:config.parryRange});if(source&&!source.dead&&source.hp)hurtEnemy(source,config.parryDamage,false);tone(1060,.14);}
function spawnEnemy(b){let z=game.biomes[b],p=game.p,x,y;for(let i=0;i<12;i++){x=clamp(p.x+rnd(-360,360),b*600+25,b*600+575);y=clamp(p.y+rnd(-300,300),30,1070);if(len(x-p.x,y-p.y)>190)break;}let sc=1+game.stage*config.chapterScale;game.enemies.push({x,y,hp:config.enemyHP*sc,maxHp:config.enemyHP*sc,biome:b,r:12,attackCD:rnd(1,3),flash:0,dead:false,type:b,boss:false});z.spawned++;}
function spawnWarden(b){let x=b*600+300,y=760,sc=1+game.stage*config.chapterScale;let e={x,y,hp:config.wardenHP*sc,maxHp:config.wardenHP*sc,biome:b,r:25,attackCD:2.3,flash:0,dead:false,boss:true,final:false,style:b,state:'approach',timer:1,cycle:0,stun:0};game.enemies.push(e);game.biomes[b].wardenSpawned=true;notify(`♜ ${BIOMES[b].name} sentinel appeared`);}
function startRaid(){if(!game||modal||game.raid||!game.biomes.every(b=>b.quest)||!allPacked())return;game.raid=true;game.enemies=[];game.shots=[];game.hazards=[];let sc=1+game.stage*.27,hp=config.bossHP*sc*config.bossDifficulty;let b={x:900,y:460,hp,maxHp:hp,biome:game.st.style%3,r:40,attackCD:2,flash:0,dead:false,boss:true,final:true,style:game.st.style,state:'approach',timer:1.8,cycle:0,stun:0};game.enemies.push(b);game.boss=b;game.raidTime=config['bossTime'+(game.stage+1)];game.p.x=900;game.p.y=710;game.p.hp=Math.min(config.playerHP,game.p.hp+60);game.p.mp=config.playerMP;game.p.inv=1;nav=null;notify('♜ RAID · '+Math.ceil(game.raidTime)+'s');}
// Boss decision tree: dead/stun > windup/execution > recovery > health/phase-selected attack.
function bossAI(e,dt){if(e.dead)return;if(e.stun>0){e.stun-=dt;return;}e.timer-=dt;let p=game.p;if(e.state==='approach'){let dx=p.x-e.x,dy=p.y-e.y,l=len(dx,dy)||1,stop=e.final?170:105;if(l>stop){e.x+=dx/l*config.enemySpeed*.45*dt;e.y+=dy/l*config.enemySpeed*.45*dt;}if(e.timer<=0)chooseBossAttack(e);}
else if(e.state==='windup'){if(e.timer<=0){resolveBossAttack(e);e.state='recover';e.timer=(e.final?.9:1.6)/(1+game.stage*.07);}}
else if(e.state==='recover'&&e.timer<=0){e.state='approach';e.timer=.2;}}
function chooseBossAttack(e){let phase=e.hp/e.maxHp<.5,cycle=e.cycle++,style=e.style,pattern;
if(style===0)pattern=cycle%2?'ring':'charge';if(style===1)pattern=cycle%2?'cross':'fan';if(style===2)pattern=cycle%2?'fan':'roots';if(style===3)pattern=cycle%3===2?'spiral':'charge';if(style===4)pattern=cycle%2?'ring':'spiral';if(style===5)pattern=['charge','roots','spiral','cross'][cycle%4];e.pattern=pattern;e.enraged=phase;e.state='windup';let wind=config.bossWindup/(1+game.stage*.055+(phase?.12:0));if(!e.final)wind*=1.2;e.timer=wind;e.windTotal=wind;let p=game.p;e.aim={x:p.x,y:p.y};let dmg=config.bossDamage*(1+game.stage*.13)*(e.final?1:.65),base={enemy:true,delay:wind,life:.2,dmg,source:e,color:'#ff8467',resolved:false,parryable:true};
if(pattern==='charge'){let dx=p.x-e.x,dy=p.y-e.y,l=len(dx,dy)||1,range=e.final?390:260;e.end={x:clamp(e.x+dx/l*range,e.final?665:20,e.final?1135:1780),y:clamp(e.y+dy/l*range,e.final?335:20,e.final?845:1080)};game.hazards.push({...base,type:'line',x:e.x,y:e.y,x2:e.end.x,y2:e.end.y,r:e.final?32:23});}
if(pattern==='ring')game.hazards.push({...base,type:'ring',x:e.x,y:e.y,r:215,inner:120});
if(pattern==='cross'){for(let a=0;a<2;a++){game.hazards.push({...base,delay:wind+a*.25,type:'line',x:p.x+(a?-210:0),y:p.y+(a?0:-210),x2:p.x+(a?210:0),y2:p.y+(a?0:210),r:24});}}
if(pattern==='roots'){let center=e.final?900:e.x;for(let i=-2;i<=2;i++)if((i+cycle)%3!==0)game.hazards.push({...base,type:'line',x:center+i*85,y:e.final?330:e.y-220,x2:center+i*85,y2:e.final?850:e.y+220,r:18});}
if(pattern==='fan'||pattern==='spiral'){game.hazards.push({...base,type:'aim',x:e.x,y:e.y,x2:p.x,y2:p.y,r:12,dmg:0,parryable:false});}
}
function resolveBossAttack(e){if(e.dead)return;let p=game.p,pattern=e.pattern;if(pattern==='charge'){e.x=e.end.x;e.y=e.end.y;if(e.style===3&&e.cycle%3===1){e.timer=.28;/* next tree cycle retargets */}}
if(pattern==='fan'||pattern==='spiral'){let n=pattern==='spiral'?12+game.stage*2:5+(e.enraged?2:0),base=Math.atan2(e.aim.y-e.y,e.aim.x-e.x);for(let i=0;i<n;i++){let a=pattern==='spiral'?i/n*Math.PI*2+e.cycle*.37:base+(i-(n-1)/2)*.2;addShot(e.x,e.y,Math.cos(a),Math.sin(a),config.bossProjectileSpeed*(1+game.stage*.08),config.bossDamage*(1+game.stage*.1),'#ff9277',{enemy:true,r:7,life:5,source:e});}if(e.style===4&&e.enraged){game.hazards.push({type:'ring',x:e.x,y:e.y,r:240,inner:150,delay:.8,life:.2,dmg:config.bossDamage,enemy:true,source:e,color:'#ff9577',resolved:false,parryable:true});}}
}
function lineDistance(p,a){let dx=a.x2-a.x,dy=a.y2-a.y,t=clamp(((p.x-a.x)*dx+(p.y-a.y)*dy)/(dx*dx+dy*dy||1),0,1);return len(p.x-(a.x+t*dx),p.y-(a.y+t*dy));}
function inHazard(p,h,extra=0){let d=len(p.x-h.x,p.y-h.y);if(h.type==='line'||h.type==='aim')return lineDistance(p,h)<h.r+extra;if(h.type==='ring')return d<h.r+extra&&d>h.inner-extra;return d<h.r+extra;}
function update(dt){if(!game||modal||mode!=='play')return;let g=game,p=g.p;g.time+=dt;p.inv=Math.max(0,p.inv-dt);p.parry=Math.max(0,p.parry-dt);p.dashCD=Math.max(0,p.dashCD-dt);p.anim=Math.max(0,p.anim-dt);p.mp=Math.min(config.playerMP,p.mp+config.mpRegen*dt);if(p.dashLeft>0){let step=Math.min(dt,p.dashLeft),ox=p.x,oy=p.y;p.x=clamp(p.x+p.dashVX*step,18,1782);p.y=clamp(p.y+p.dashVY*step,18,1082);p.dashLeft=Math.max(0,p.dashLeft-step);if(g.raid){p.x=clamp(p.x,660,1140);p.y=clamp(p.y,330,850);}g.effects.push({x:ox,y:oy,x2:p.x,y2:p.y,c:'#9feaff',life:.22,max:.22,trail:true});}else if(len(joy.x,joy.y)>.08){let l=len(joy.x,joy.y),speed=config.moveSpeed*(1+meta.speed*.06);p.x=clamp(p.x+joy.x*speed*dt,18,1782);p.y=clamp(p.y+joy.y*speed*dt,18,1082);p.faceX=joy.x/l;p.faceY=joy.y/l;}if(g.raid){p.x=clamp(p.x,660,1140);p.y=clamp(p.y,330,850);g.raidTime-=dt;if(g.raidTime<=0){g.raidTime=0;defeat('Raid time expired.');return;}}else{let b=biomeAt(p.x),z=g.biomes[b];if(!z.visited&&len(p.x-(b*600+300),p.y-300)<62){z.visited=true;notify(`◇ ${BIOMES[b].name} beacon ✓`);tone(650,.18);questUpdate(b);}if(z.spawned<config.tallyTarget&&g.enemies.filter(e=>!e.dead&&!e.boss).length<config.maxEnemies){z.spawnClock+=dt*config.spawnRate;while(z.spawnClock>=1&&z.spawned<config.tallyTarget&&g.enemies.filter(e=>!e.dead&&!e.boss).length<config.maxEnemies){z.spawnClock--;spawnEnemy(b);}}if(!z.wardenSpawned&&z.kills>=Math.ceil(config.tallyTarget*.5))spawnWarden(b);}
for(let w of g.weapons){w.cd=Math.max(0,w.cd-dt);if((w.id>=3&&!w.ultimate)||w.ultimate){w.timer-=dt;if(w.timer<=0){w.timer=config.passiveInterval/(config.attackSpeed*(1+w.speed*config.weaponSpeedGain)*variantOf(w).rate);let passiveId=w.ultimate?DEF[w.id].pair:w.id;let r=(passiveId===4?360:passiveId===5?100:86)*(1+w.aoe*config.weaponAOEGain)*(w.awake?1.2:1)*variantOf(w).area,d=damage(w);if(passiveId===4){let e=nearest(r);if(e)shootBow(w,e,true);}else damageArea(p.x,p.y,r,d*(passiveId===5?.65:.85)*(w.ultimate?.55:1));}}}if(fireHeld)fireWeapon();
for(let e of [...g.enemies]){if(e.dead)continue;e.flash=Math.max(0,e.flash-dt);e.attackCD-=dt;if(e.boss){bossAI(e,dt);}else{let dx=p.x-e.x,dy=p.y-e.y,l=len(dx,dy)||1,speed=config.enemySpeed*(1+g.stage*.055)*(e.type===2?1.15:1);if(l>e.r+config.playerRadius*.5){e.x+=dx/l*speed*dt;e.y+=dy/l*speed*dt;}if(e.type===1&&e.attackCD<=0&&l<340){addShot(e.x,e.y,dx,dy,100,config.enemyDamage,'#eec789',{enemy:true,r:5,life:3.5,source:e});e.attackCD=3.4;}}if(dist(e,p)<e.r+config.playerRadius&&e.attackCD<=0){if(p.parry>0)parry(e);else hurtPlayer(e.boss?config.bossDamage*.6:config.enemyDamage*(1+g.stage*.1),e);e.attackCD=.9;if(mode!=='play')return;}}
for(let h of [...g.hazards]){h.delay-=dt;if(h.delay<=0&&!h.resolved){h.resolved=true;if(h.enemy){if(h.type!=='aim'&&inHazard(p,h,config.playerRadius)){if(p.parry>0&&h.parryable){parry(h.source);if(h.source)h.source.stun=.6;}else hurtPlayer(h.dmg,h.source);}}else damageArea(h.x,h.y,h.r,h.dmg);}if(h.resolved)h.life-=dt;if(mode!=='play')return;}g.hazards=g.hazards.filter(h=>h.life>0&&(!h.source||!h.source.dead));
for(let s of g.shots){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;if(s.enemy){if(len(s.x-p.x,s.y-p.y)<s.r+config.playerRadius){if(p.parry>0){parry(s.source);s.enemy=false;s.vx*=-1;s.vy*=-1;s.c='#ffe098';s.dmg=config.parryDamage;s.life=2;}else{hurtPlayer(s.dmg,s.source);s.life=0;}}}else{for(let e of [...g.enemies])if(!e.dead&&!s.hit.has(e)&&len(s.x-e.x,s.y-e.y)<s.r+e.r){s.hit.add(e);hurtEnemy(e,s.dmg);if(s.pierce-->0){}else{s.life=0;break;}}}if(mode!=='play')return;}g.shots=g.shots.filter(s=>s.life>0&&s.x>-50&&s.x<1850&&s.y>-50&&s.y<1150);g.enemies=g.enemies.filter(e=>!e.dead);
for(let e of g.effects){e.life-=dt;if(e.vx!==undefined){e.x+=e.vx*dt;e.y+=e.vy*dt;}}g.effects=g.effects.filter(e=>e.life>0);for(let t of g.texts){t.life-=dt;t.y-=20*dt;}g.texts=g.texts.filter(t=>t.life>0);if(g.texts.length>70)g.texts.splice(0,g.texts.length-70);processPending();}
function bank(){if(game&&!game.settled){meta.gold+=Math.floor(game.runGold);game.settled=true;save();}}
function victory(){mode='result';bank();meta.unlocked=Math.max(meta.unlocked,Math.min(5,game.stage+1));if(!meta.cleared.includes(game.stage))meta.cleared.push(game.stage);save();resultScreen(true,'Raid cleared.');tone(880,.4);}

function mapSheet(){if(!game)return;modal='mapSheet';show(`<div class="sheetHeader"><div><div class="eyebrow">MAP / PAUSED</div><h2>Three fronts</h2></div><button id="mapDone">▶ Resume</button></div><canvas id="bigMap" width="820" height="440" aria-label="Tap a biome to track its next objective"></canvas><div class="mapLegend"><span>◇ Beacon</span><span>♜ Sentinel</span><span>● You</span></div><div class="mapBiomeButtons">${BIOMES.map((b,i)=>`<button id="mapBiome${i}" style="border-color:${b.color};color:${b.color}">${b.name}</button>`).join('')}</div>`);renderMapSheet();let track=i=>{let z=game.biomes[i],e=game.enemies.find(e=>e.boss&&!e.final&&e.biome===i&&!e.dead);nav=!z.visited?{x:i*600+300,y:300}:e?{x:e.x,y:e.y}:{x:i*600+300,y:550};closeModal();notify('⌖ '+BIOMES[i].name);};btn('mapDone',()=>closeModal());BIOMES.forEach((_,i)=>btn('mapBiome'+i,()=>track(i)));$('bigMap').onpointerdown=e=>{if(game.raid)return;let r=$('bigMap').getBoundingClientRect();track(clamp(Math.floor((e.clientX-r.left)/r.width*3),0,2));};}

function saneConfig(obj){let out={...config};for(let k in DEFAULT){let value=Number(obj[k]);if(!Number.isFinite(value))continue;let min=0,max=100000;if(['critRate','playerDodge','enemyDodge','masterVolume'].includes(k))max=1;if(['attackSpeed','activeCooldown','passiveInterval','dashCooldown','bossDifficulty','bossWindup'].includes(k))min=.05;if(['playerHP','playerMP','enemyHP','bossHP','wardenHP','maxEnemies','tallyTarget','levelCap','killsPerUpgrade'].includes(k))min=1;if(['killsPerUpgrade','questUpgradePoints','questAwakeningSeals'].includes(k))max=100;if(k==='weaponRerolls')max=5;if(k==='dashDuration'){min=.06;max=.6;}if(k==='levelCap'){min=5;max=30;}if(k==='tallyTarget')max=150;if(k==='maxEnemies')max=100;if(k.startsWith('bossTime')){min=10;max=3600;}value=clamp(value,min,max);if(['maxEnemies','tallyTarget','levelCap','playerHP','playerMP','enemyHP','bossHP','wardenHP','goldPerKill','goldPerWarden','goldPerBoss','killsPerUpgrade','questUpgradePoints','questAwakeningSeals','weaponRerolls'].includes(k))value=Math.round(value);out[k]=value;}return out;}

function inspector(origin){modal='inspector';show(`<div class="row"><div><div class="eyebrow">BALANCE INSPECTOR / LOCAL TUNING</div><h2>Simulation parameters</h2></div><button id="insClose">${origin==='menu'?'Main menu':'Resume'}</button></div><p class="muted">Apply edits explicitly. HP/MP maxima clamp the player but do not heal. Spawned enemy HP is unchanged. Tally targets and weapon caps apply next run, avoiding broken in-progress quests. All units are world pixels and seconds. Chance values use 0–1.</p><div class="buttons"><button class="primary" id="applyConfig">Apply & remember</button><button id="downloadMD">Export .md report</button><button id="downloadJSON">Export settings .json</button><button id="importConfig">Import settings .json</button><button id="defaultConfig">Load defaults into fields</button></div><input id="fileInput" type="file" accept=".json,application/json" class="hide"><div id="insMsg" class="note" style="margin-top:14px">Mobile dash: 120px default / 0.16s burst. Reports contain current applied settings, weapon stats, quests, gold, and session telemetry. Download location follows your browser settings. Storage: ${storageOK?'available':'session only'}.</div>${Object.entries(GROUPS).map(([name,keys])=>`<div class="inspectGroup"><h3>${name}</h3><div class="inspectFields">${keys.map(k=>`<label class="field">${LABELS[k]||'Raid '+k.replace('bossTime','')+' time limit · seconds'}<input type="number" id="cfg_${k}" value="${config[k]}" step="${Number.isInteger(DEFAULT[k])?'1':'0.01'}"></label>`).join('')}</div></div>`).join('')}<div class="buttons"><button id="insClose2">${origin==='menu'?'Main menu':'Resume'}</button></div>`);
function leave(){if(origin==='menu')mainMenu();else{closeModal();updateHUD();processPending();}}btn('insClose',leave);btn('insClose2',leave);btn('applyConfig',()=>{let vals={};for(let k in DEFAULT)vals[k]=$('cfg_'+k).value;let old={...config},next=saneConfig(vals);if(game&&mode==='play'){next.levelCap=old.levelCap;next.tallyTarget=old.tallyTarget;next.killsPerUpgrade=old.killsPerUpgrade;}config=next;if(game){game.p.hp=Math.min(game.p.hp,config.playerHP);game.p.mp=Math.min(game.p.mp,config.playerMP);}save();for(let k in DEFAULT)$('cfg_'+k).value=config[k];$('insMsg').textContent='Applied and saved. During a run, cap, tally and kill-threshold changes are rejected; edit them from the main menu. Existing boss clocks and enemy HP remain unchanged.';});btn('downloadMD',()=>exportReport());btn('downloadJSON',()=>download('triad-balance.json',JSON.stringify({version:VERSION,config},null,2),'application/json'));btn('importConfig',()=>$('fileInput').click());$('fileInput').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text()),clean=saneConfig(obj.config||obj);for(let k in DEFAULT)$('cfg_'+k).value=clean[k];$('insMsg').textContent='Imported into fields. Press Apply & remember to use them.';}catch(err){$('insMsg').textContent='Import failed: select a valid exported JSON settings file.';}};btn('defaultConfig',()=>{for(let k in DEFAULT)$('cfg_'+k).value=DEFAULT[k];$('insMsg').textContent='Defaults loaded into fields; press Apply & remember.';});}
function download(name,content,type='text/plain'){let blob=new Blob([content],{type}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
function exportReport(){let g=game;let lines=[`# TRIAD balance / session report`,``,`Version: ${VERSION} / mobile HUD`,`Exported: ${new Date().toISOString()}`,`Renderer: canvas-based isometric voxel-style (not a volumetric 3D engine).`,`Saved menu gold: ${meta.gold}`,`Tech: movement ${meta.speed}/5, boss gold ${meta.bounty}/5`,``,`## Applied parameters`,``,`| Parameter | Value |`,`|---|---:|`,...Object.keys(DEFAULT).map(k=>`| ${LABELS[k]||k} (${k}) | ${config[k]} |`)];if(g){lines.push('','## Current run',`Stage: ${stageLabel(g.st)} / ${g.st.name}`,`Started: ${g.startAt}`,`Elapsed simulation seconds: ${g.time.toFixed(2)}`,`Mode: ${mode}; paused modal: ${modal||'none'}`,`Gold earned: ${g.runGold}; settled: ${g.settled}`,`HP: ${g.p.hp.toFixed(1)} / ${config.playerHP}; MP: ${g.p.mp.toFixed(1)} / ${config.playerMP}`,`Effective movement speed: ${(config.moveSpeed*(1+meta.speed*.06)).toFixed(2)}`,`Effective dash distance: ${config.dashDistance+g.dashUp*config.dashUpgrade}`,`Boss timer remaining: ${g.raidTime.toFixed(2)}`,`Fusions: ${g.combo}/3`,'','## Telemetry',`- regularKills: ${g.regularKills}`,`- nextPointProgress: ${g.xp}/${config.killsPerUpgrade}`,`- storedPoints: ${g.points}`,`- storedAwakeningSeals: ${g.awakeningTokens}`,`- pendingWeaponRewards: ${g.pendingPick.length}`,`- rerollsRemaining: ${g.pendingPick.map(r=>r.rerolls).join(", ")}`,...Object.entries(g.stats).map(([k,v])=>`- ${k}: ${typeof v==='number'?v.toFixed(2):v}`),'','## Biome quests',...g.biomes.map((b,i)=>`- ${BIOMES[i].name}: kills ${b.kills}/${config.tallyTarget}; spawned ${b.spawned}; beacon ${b.visited}; sentinel defeated ${b.wardenDead}; quest ${b.quest}`),'','## Weapons','| Weapon | Type | Level | Damage upgrades | Speed upgrades | CDR | AOE | Awakened | Cooldown remaining | Bag x,y,rotation |','|---|---|---:|---:|---:|---:|---:|---|---:|---|',...g.weapons.map(w=>`| ${displayName(w)} | ${DEF[w.id].type} | ${w.level} | ${w.dmg} | ${w.speed} | ${w.cdr} | ${w.aoe} | ${w.awake} | ${w.cd.toFixed(2)} | ${w.x},${w.y},${w.rot*90}deg / ${variantOf(w).name} |`),'','## Event log',...g.log.map(l=>'- '+l));}lines.push('','## Reusable JSON settings','```json',JSON.stringify({version:VERSION,config},null,2),'```','','Notes: reports are explicit user-triggered downloads, not continuous writes into a folder. Browser download preferences choose the destination. Active attack-speed upgrades add follow-up strike/volley/impact damage; passive attack speed shortens the attack interval. Cooldown reduction is a separate active-only stat. One point per configured regular-kill threshold. Quest points and universal awakening seals are stored until spent. Weapon claims remain optional, preserve reroll counts, and only commit after manual packing. Change point/seal budgets if changing caps or quotas.');download('triad-balance-'+new Date().toISOString().replace(/[:.]/g,'-')+'.md',lines.join('\n'),'text/markdown');}
// Isometric stacked-cube renderer. World movement and collisions remain in a flat arena.
function camera(){return game?{x:game.p.x,y:game.p.y}:{x:900+Math.sin(performance.now()/9000)*180,y:530};}
function viewScale(){return Math.min(1,Math.max(.76,Math.min(W/450,H/520)));}function project(x,y,z=0){let c=camera(),s=viewScale(),dx=x-c.x,dy=y-c.y;return {x:W*.5+(dx-dy)*.78*s,y:H*.48+(dx+dy)*.39*s-z*s};}
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}}
function shade(hex,f){let s=hex.replace('#','');if(s.length!==6)return hex;let n=parseInt(s,16),r=clamp((n>>16)*f,0,255)|0,g=clamp(((n>>8)&255)*f,0,255)|0,b=clamp((n&255)*f,0,255)|0;return `rgb(${r},${g},${b})`;}
function cube(x,y,z,size,h,c){let a=project(x-size/2,y-size/2,z),b=project(x+size/2,y-size/2,z),c1=project(x+size/2,y+size/2,z),d=project(x-size/2,y+size/2,z),at=project(x-size/2,y-size/2,z+h),bt=project(x+size/2,y-size/2,z+h),ct=project(x+size/2,y+size/2,z+h),dt=project(x-size/2,y+size/2,z+h);poly([b,c1,ct,bt],shade(c,.62));poly([d,c1,ct,dt],shade(c,.8));poly([at,bt,ct,dt],shade(c,1.12));}
function worldCircle(x,y,r,color,width=2,fill=null){let p=project(x,y);ctx.beginPath();ctx.ellipse(p.x,p.y,r*1.103*viewScale(),r*.552*viewScale(),0,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();}
function worldLine(x,y,x2,y2,r,c,fill=false){let dx=x2-x,dy=y2-y,l=len(dx,dy)||1,nx=-dy/l*r,ny=dx/l*r;poly([project(x+nx,y+ny),project(x2+nx,y2+ny),project(x2-nx,y2-ny),project(x-nx,y-ny)],fill?c:null,c);}
function label(x,y,t,c='#d9f2ff',z=0,size=11){let p=project(x,y,z);ctx.font=`600 ${size}px system-ui`;ctx.textAlign='center';ctx.fillStyle='#07111c';ctx.fillText(t,p.x+1,p.y+1);ctx.fillStyle=c;ctx.fillText(t,p.x,p.y);}
function drawTerrain(){ctx.fillStyle='#09131e';ctx.fillRect(0,0,W,H);for(let x=0;x<1800;x+=80)for(let y=0;y<1100;y+=80){let b=biomeAt(x+40),p=project(x+40,y+40);if(p.x<-100||p.x>W+100||p.y<-80||p.y>H+120)continue;let c=((x/80+y/80)%2)?BIOMES[b].ground:BIOMES[b].dark;poly([project(x,y),project(x+80,y),project(x+80,y+80),project(x,y+80)],c,'#91b8a409');}for(let b=1;b<3;b++)worldLine(b*600,0,b*600,1100,1,'#c3e2db26',true);}
function drawHazards(){if(!game)return;for(let h of game.hazards){let c=h.enemy?(h.delay<.3?'#ff7369':'#ffcd79'):'#be9dff',alpha=h.resolved?.35:.2;ctx.globalAlpha=1;if(h.type==='line'||h.type==='aim'){worldLine(h.x,h.y,h.x2,h.y2,h.r,c,false);if(h.resolved)worldLine(h.x,h.y,h.x2,h.y2,h.r,c+'70',true);}else{worldCircle(h.x,h.y,h.r,c,h.resolved?5:2,h.resolved?c+'40':null);if(h.inner)worldCircle(h.x,h.y,h.inner,c,2);if(!h.enemy){let p=project(h.x,h.y,Math.max(0,h.delay)*200);ctx.fillStyle='#e4c8ff';ctx.fillRect(p.x-5,p.y-9,10,12);}}}}
function drawDecor(d){let {x,y,b}=d;if(b===0){if(d.type<.45){cube(x,y,0,17,5,'#3e7262');cube(x,y,5,7,d.h,'#6a9c66');}else{cube(x,y,0,15,9,'#4d6660');cube(x-5,y+3,9,10,6,'#698979');}}if(b===1){if(d.type<.4){cube(x,y,0,10,d.h,'#6b9d7b');cube(x+9,y,8,12,6,'#629575');}else cube(x,y,0,14,d.h*.6,'#b09364');}if(b===2){cube(x,y,0,10,d.h+12,'#655b45');cube(x,y,d.h+10,33,16,'#4b8062');cube(x-7,y-4,d.h+24,24,12,'#659970');}}
function drawBeacon(b){let x=b*600+300,y=300,done=game&&game.biomes[b].visited;worldCircle(x,y,55,done?'#a0ead0':BIOMES[b].color,2,BIOMES[b].color+'15');cube(x,y,0,36,10,'#617d7c');cube(x,y,10,19,35,BIOMES[b].color);cube(x,y,49+Math.sin(performance.now()/450)*3,13,12,done?'#ddffef':BIOMES[b].color);label(x,y,done?'◇ ✓':'◇',BIOMES[b].color,82,10);}
function drawEntity(e,player=false){let p=game.p,c=player?'#a7eaff':e.boss?BIOMES[e.biome].color:BIOMES[e.biome].color,sz=player?18:e.boss?(e.final?49:34):20,h=player?21:e.boss?(e.final?43:30):16;if(e.flash>0)c='#ffffff';worldCircle(e.x,e.y,sz*.9,'#00000000',0,'#07121b70');if(player&&p.inv>0)worldCircle(e.x,e.y,28,p.parry>0?'#ffdf8e':'#a1e7ff',3);cube(e.x,e.y,0,sz,h,player?'#375b8a':shade(c,.55));cube(e.x,e.y,h,sz*.82,h*.58,c);if(player){cube(e.x-5,e.y-4,h*1.55,9,5,'#e7faf8');cube(e.x+12,e.y,7,5,22,'#cee8ff');}else{cube(e.x-5,e.y+7,h*1.2,5,4,'#101c2b');if(e.boss){cube(e.x-sz*.4,e.y,h*1.5,8,13,'#ecd9a1');cube(e.x+sz*.4,e.y,h*1.5,8,13,'#ecd9a1');if(e.state==='windup'){worldCircle(e.x,e.y,sz*1.25,e.timer<.3?'#ff6b68':'#ffd183',3);label(e.x,e.y,e.pattern.toUpperCase(),e.timer<.3?'#ff8177':'#ffd18e',h*2.3,11);}}}if(!player){let pos=project(e.x,e.y,h*2.1+9),ww=e.boss?70:25;ctx.fillStyle='#091322';ctx.fillRect(pos.x-ww/2,pos.y,ww,4);ctx.fillStyle=e.boss?'#ffc184':'#b3e4b6';ctx.fillRect(pos.x-ww/2,pos.y,ww*Math.max(0,e.hp/e.maxHp),4);}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);drawTerrain();if(game&&game.raid){poly([project(650,320),project(1150,320),project(1150,860),project(650,860)],'#182a344d','#eeaf7777');worldCircle(900,580,240,'#e6c18a33',2);}
let objects=[];for(let d of decor){let p=project(d.x,d.y);if(p.x>-100&&p.x<W+100&&p.y>-60&&p.y<H+120)objects.push({depth:d.x+d.y,draw:()=>drawDecor(d)});}for(let b=0;b<3;b++)objects.push({depth:b*600+600,draw:()=>drawBeacon(b)});drawHazards();if(game){for(let e of game.enemies)if(!e.dead)objects.push({depth:e.x+e.y,draw:()=>drawEntity(e)});objects.push({depth:game.p.x+game.p.y,draw:()=>drawEntity(game.p,true)});}objects.sort((a,b)=>a.depth-b.depth);for(let o of objects)o.draw();if(game){for(let s of game.shots){cube(s.x,s.y,13,s.enemy?9:7,s.enemy?9:12,s.c);}for(let e of game.effects){ctx.globalAlpha=Math.min(1,e.life/(e.max||.3));if(e.trail){worldLine(e.x,e.y,e.x2,e.y2,8,e.c+'aa',true);cube(e.x,e.y,0,15,18,'#74c9e6');}else if(e.ring)worldCircle(e.x,e.y,e.ring,e.c,3);else if(e.slash){let pts=[project(e.x,e.y,14)];for(let i=0;i<=12;i++){let a=e.angle-1.5+i/12*3;pts.push(project(e.x+Math.cos(a)*e.slash,e.y+Math.sin(a)*e.slash,14));}poly(pts,e.c+'77',e.c);}else{let p=project(e.x,e.y,18);ctx.fillStyle=e.c;ctx.fillRect(p.x,p.y,e.size,e.size);}ctx.globalAlpha=1;}for(let t of game.texts){ctx.globalAlpha=Math.min(1,t.life*2);label(t.x,t.y,t.t,t.c,48,12);ctx.globalAlpha=1;}drawNavigation();}let v=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.2,W/2,H/2,Math.max(W,H)*.7);v.addColorStop(0,'#050c1200');v.addColorStop(1,'#030a1266');ctx.fillStyle=v;ctx.fillRect(0,0,W,H);}
function objectiveTarget(){if(nav)return nav;if(!game||game.raid)return null;let b=biomeAt(game.p.x),z=game.biomes[b];if(!z.visited)return{x:b*600+300,y:300};if(z.wardenSpawned&&!z.wardenDead){let e=game.enemies.find(e=>e.boss&&!e.final&&e.biome===b&&!e.dead);return e?{x:e.x,y:e.y}:{x:b*600+300,y:760};}if(z.quest){let next=game.biomes.findIndex(v=>!v.quest);if(next>=0)return{x:next*600+300,y:300};}return null;}
function drawNavigation(){let tar=objectiveTarget();if(!tar||!game)return;if(nav&&dist(game.p,nav)<55)nav=null;let pp=project(tar.x,tar.y),cx=W/2,cy=H*.48,dx=pp.x-cx,dy=pp.y-cy,l=len(dx,dy);if(l<80)return;let r=Math.min(W*.27,H*.25),a=Math.atan2(dy,dx),px=cx+Math.cos(a)*r,py=cy+Math.sin(a)*r;ctx.save();ctx.translate(px,py);ctx.rotate(a);poly([{x:11,y:0},{x:-6,y:-6},{x:-3,y:0},{x:-6,y:6}],'#c5f3e9');ctx.restore();ctx.textAlign='center';ctx.font='11px system-ui';ctx.fillStyle='#c5f3e9';ctx.fillText(Math.round(dist(game.p,tar))+' px',px,py+20);}
function drawMap(){if(!game)return;let c=mapctx,w=410,h=220;c.clearRect(0,0,w,h);for(let b=0;b<3;b++){c.fillStyle=BIOMES[b].ground;c.fillRect(b*w/3,0,w/3,h);c.fillStyle=BIOMES[b].color;c.font='bold 16px system-ui';c.textAlign='center';c.fillText(BIOMES[b].name,b*w/3+w/6,22);let z=game.biomes[b],x=(b*600+300)/1800*w,y=300/1100*h;c.strokeStyle=BIOMES[b].color;c.lineWidth=2;c.strokeRect(x-8,y-8,16,16);if(z.visited){c.fillStyle=BIOMES[b].color;c.fillRect(x-5,y-5,10,10);}if(!z.wardenDead){c.fillStyle=z.wardenSpawned?'#ff8f8c':'#8b9caa';c.beginPath();c.moveTo(x,145);c.lineTo(x+9,154);c.lineTo(x,163);c.lineTo(x-9,154);c.closePath();c.fill();}else{c.fillStyle='#d2eadf';c.fillText('✓',x,160);}if(z.quest){c.fillStyle='#d9f4e2';c.fillText('CLEAR',x,205);}}if(game.raid){c.strokeStyle='#ffe1ad';c.strokeRect(650/1800*w,320/1100*h,500/1800*w,540/1100*h);}for(let e of game.enemies){c.fillStyle=e.boss?'#ff8f8c':'#fd9393';c.fillRect(e.x/1800*w-2,e.y/1100*h-2,e.boss?7:4,e.boss?7:4);}let p=game.p;c.fillStyle='#f4ffff';c.beginPath();c.arc(p.x/1800*w,p.y/1100*h,6,0,Math.PI*2);c.fill();if(nav){c.strokeStyle='#ffffff';c.beginPath();c.arc(nav.x/1800*w,nav.y/1100*h,11,0,Math.PI*2);c.stroke();}}
function updateHUD(){if(!game)return;let g=game,p=g.p;$('stageTitle').textContent=stageLabel(g.st);$('goldHud').textContent=Math.floor(g.runGold)+' G';$('hpText').textContent=`♥ ${Math.ceil(p.hp)}/${config.playerHP}`;$('mpText').textContent=`MP ${Math.floor(p.mp)}`;$('hpBar').style.width=clamp(p.hp/config.playerHP*100,0,100)+'%';$('mpBar').style.width=clamp(p.mp/config.playerMP*100,0,100)+'%';
$('tallies').innerHTML=g.biomes.map((z,i)=>`<div class="tally" style="--biomeColor:${BIOMES[i].color}"><div class="row"><span>${['SW','DE','JU'][i]}</span><span>${z.quest?'✓':z.kills+'/'+config.tallyTarget}</span></div><div class="bar"><i style="width:${Math.min(100,z.kills/config.tallyTarget*100)}%;background:${BIOMES[i].color}"></i></div></div>`).join('');
$('growthText').textContent=`${g.xp}/${config.killsPerUpgrade}`;$('growthBar').style.width=g.xp/config.killsPerUpgrade*100+'%';$('upgradeBtn').textContent=`↑ ${g.points}`;$('sealBtn').textContent=`✦ ${g.awakeningTokens}`;$('lootBtn').textContent=`▣ ${g.pendingPick.length}`;
let count=g.points+g.awakeningTokens+g.pendingPick.length;$('menuBadge').textContent=count?String(count):'';$('menuBadge').style.display=count?'grid':'none';
let active=g.weapons.find(w=>w.id===g.active);$('fireName').textContent=active?(active.ultimate?'ULT':DEF[active.id].short):'—';$('fireCd').textContent=active&&active.cd>.05?active.cd.toFixed(1):'';$('dashCd').textContent=p.dashCD>.05?p.dashCD.toFixed(1):'';
let b=biomeAt(p.x),z=g.biomes[b];$('questHint').textContent=g.raid?'':g.biomes.every(q=>q.quest)?'✓ Three quests complete':!z.visited?'◇ '+BIOMES[b].shrine:!z.wardenSpawned?`☠ ${z.kills}/${Math.ceil(config.tallyTarget/2)} → ♜`:!z.wardenDead?'♜ Sentinel':`☠ ${z.kills}/${config.tallyTarget}`;$('questHint').style.display=g.raid||g.biomes.every(q=>q.quest)?'none':'block';
let launch=!g.raid&&g.biomes.every(q=>q.quest);if(launch&&!$('launchRaid')){$('raidLaunch').innerHTML='<button class="primary" id="launchRaid">♜ RAID →</button>';btn('launchRaid',startRaid);}else if(!launch)$('raidLaunch').innerHTML='';
let boss=g.boss&&!g.boss.dead?g.boss:null;$('bossHud').style.display=boss?'block':'none';if(boss){$('bossName').textContent=g.st.boss+(boss.enraged?' !':'');$('bossTime').textContent=Math.ceil(g.raidTime)+'s';$('bossBar').style.width=Math.max(0,boss.hp/boss.maxHp*100)+'%';$('bossHint').textContent='';}drawMap();if(modal==='mapSheet')renderMapSheet();}
function questJournal(){if(!game||mode!=='play')return;modal='quests';show(`<div class="row"><h2>◇ Quests</h2><button id="questClose">DONE →</button></div><div class="cards">${game.biomes.map((z,i)=>`<div class="card" style="border-top:3px solid ${BIOMES[i].color}"><h3>${BIOMES[i].name} ${z.quest?'✓':''}</h3><div class="questIcons"><div class="${z.visited?'doneGlyph':''}"><i>◇</i><span>${z.visited?'✓':'Beacon'}</span></div><div class="${z.kills>=config.tallyTarget?'doneGlyph':''}"><i>☠</i><span>${z.kills}/${config.tallyTarget}</span></div><div class="${z.wardenDead?'doneGlyph':z.wardenSpawned?'liveGlyph':''}"><i>♜</i><span>${z.wardenDead?'✓':z.wardenSpawned?'Alive':Math.ceil(config.tallyTarget/2)+' kills'}</span></div></div><div class="questRewards">↑ ${config.questUpgradePoints} · ✦ ${config.questAwakeningSeals} · ♥ 35</div><button id="track${i}">${z.quest?'✓ Complete':'⌖ Track'}</button></div>`).join('')}</div><div class="helpFlow miniFlow"><div><i>◇</i><span>Beacon</span></div><b>+</b><div><i>☠</i><span>Full tally</span></div><b>+</b><div><i>♜</i><span>Sentinel</span></div><b>=</b><div><i>✓</i><span>Quest</span></div></div><details><summary>Reward details</summary><p class="muted">${config.tallyTarget} regular kills store one weapon choice. The sentinel spawns at ${Math.ceil(config.tallyTarget/2)} kills. Each completed quest stores ${config.questAwakeningSeals} universal awakening seals; spend each on a max-level weapon of your choice in Upgrades. Rewards never apply automatically. All three quests unlock the final raid, even if you leave weapon rewards for later.</p></details>`);game.biomes.forEach((z,i)=>btn('track'+i,()=>{let e=game.enemies.find(e=>e.boss&&!e.final&&e.biome===i&&!e.dead);nav=!z.visited?{x:i*600+300,y:300}:e?{x:e.x,y:e.y}:{x:i*600+300,y:550};closeModal();}));btn('questClose',()=>closeModal());}

function joystickMove(e){if(e.pointerId!==joy.id)return;let r=$('joystick').getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=len(dx,dy),limit=r.width*.32;if(l>limit){dx=dx/l*limit;dy=dy/l*limit;}$('stick').style.transform=`translate(${dx}px,${dy}px)`;let sx=dx/limit,sy=dy/limit; // Invert the isometric projection so screen-up really moves screen-up.
let wx=sx/.78/2+sy/.39/2,wy=sy/.39/2-sx/.78/2,wl=len(wx,wy),strength=Math.min(1,len(sx,sy));joy.x=wl?wx/wl*strength:0;joy.y=wl?wy/wl*strength:0;}
$('joystick').onpointerdown=e=>{if(modal||mode!=='play')return;e.preventDefault();joy.id=e.pointerId;$('joystick').setPointerCapture(e.pointerId);joystickMove(e);tone(120,.01,.1);};$('joystick').onpointermove=joystickMove;function joyEnd(e){if(e.pointerId===joy.id){joy.id=null;joy.x=joy.y=0;$('stick').style.transform='';}}$('joystick').onpointerup=joyEnd;$('joystick').onpointercancel=joyEnd;$('joystick').onlostpointercapture=joyEnd;
$('fire').onpointerdown=e=>{if(modal||mode!=='play')return;e.preventDefault();$('fire').setPointerCapture(e.pointerId);fireHeld=true;fireWeapon();};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>$('fire').addEventListener(ev,()=>fireHeld=false));$('swap').onpointerdown=e=>{e.preventDefault();if(modal||!game||mode!=='play')return;let ids=game.weapons.filter(w=>w.id<3).map(w=>w.id).sort(),i=ids.indexOf(game.active);game.active=ids[(i+1)%ids.length];tone(350);updateHUD();};$('dash').onpointerdown=e=>{e.preventDefault();dash();};$('map').onpointerdown=e=>{if(!game||modal||game.raid)return;let r=$('map').getBoundingClientRect(),x=clamp((e.clientX-r.left)/r.width*1800,0,1800),b=biomeAt(x);nav={x:b*600+300,y:game.biomes[b].visited?760:300};notify('Compass set to '+BIOMES[b].name+'.');};btn('questBtn',()=>{if(game&&!modal)questJournal()});btn('helpBtn',()=>{if(game&&!modal)guide(true)});$('questHint').onclick=()=>{if(game&&!modal)questJournal()};btn('upgradeBtn',()=>{if(game&&!modal)upgradeScreen()});btn('sealBtn',()=>{if(game&&!modal)upgradeScreen()});btn('lootBtn',()=>{if(game&&!modal)weaponChoiceScreen()});btn('bagBtn',()=>{if(game&&!modal&&mode==='play')packScreen()});btn('pauseBtn',()=>{if(!modal)pauseScreen()});btn('inspectBtn',()=>{if(game&&!modal)inspector('play')});
addEventListener('contextmenu',e=>e.preventDefault());addEventListener('blur',()=>{resetInput();if(mode==='play'&&!modal)pauseScreen();});document.addEventListener('visibilitychange',()=>{if(document.hidden){resetInput();if(mode==='play'&&!modal)pauseScreen();}});addEventListener('error',e=>{$('error').textContent='Prototype error: '+e.message+' · Please export a report before reloading.';});
function frame(t){let dt=Math.min(.04,(t-lastFrame)/1000||.016);lastFrame=t;try{update(dt);draw();if(game&&t-lastHud>100){updateHUD();lastHud=t;}if(t>toastUntil)$('toast').style.opacity=0;}catch(e){$('error').textContent=e.message;console.error(e);mode='error';}requestAnimationFrame(frame);}
makeDecor();mainMenu();requestAnimationFrame(frame);
</script></body></html>
