pipeline:
  stages:
    - steps:
        - run:
            script: find /harness -maxdepth 3 -type f -iname '*.html' -print
    - id: nodeNpmBuildTestHostedLinuxStage_1
      name: Node npm Build and Test on Harness Cloud (Linux)
      timeout: 20m
      clone:
        enabled: true
      cache:
        enabled: true
      steps:
        - id: setupNode
          name: Setup Node
          template:
            uses: setupNode@1.0.0
        - id: agent_group
          name: Agent Time Box
          timeout: 12m
          on-failure:
            errors: all
            action: ignore
          group:
            steps:
              - name: HTML Game Reviewer
                id: HTML_Game_Reviewer
                template:
                  uses: ca_html_game_reviewer@1.0.3
        - name: Push Updated Game
          id: Push_Updated_Game
          run:
            env:
              GITHUB_TOKEN: ${{ secrets.getValue("Github_Token") }}
            script: |-
              set -e
              GIT_DIR_PATH=$(find /harness -maxdepth 3 -name .git -type d | head -n 1)
              cd "$(dirname "$GIT_DIR_PATH")"
              GAME=TRIAD_Mobile_Patch_v06.html
              if [ ! -s "$GAME" ]; then
                echo "ERROR: $GAME was not produced"
                exit 1
              fi
              if cmp -s TRIAD_Mobile_Patch_v05.html "$GAME"; then
                echo "ERROR: $GAME is identical to v05, the agent made no changes (check the agent step log). Not pushing."
                exit 1
              fi
              if ! grep -qi "</html>" "$GAME"; then
                echo "ERROR: $GAME looks incomplete (no closing html tag)"
                exit 1
              fi
              cat > /tmp/jscheck.py <<'PY'
              import re, sys, subprocess
              s = open(sys.argv[1], encoding='utf-8').read()
              blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', s, re.S)
              print('inline script blocks:', len(blocks))
              bad = 0
              for i, b in enumerate(blocks):
                  p = '/tmp/game%d.js' % i
                  open(p, 'w', encoding='utf-8').write(b)
                  if subprocess.run(['node', '--check', p]).returncode != 0:
                      bad = 1
              sys.exit(1 if (bad or not blocks) else 0)
              PY
              if ! python3 /tmp/jscheck.py "$GAME"; then
                echo "ERROR: v06 has a JavaScript syntax error, not pushing"
                exit 1
              fi
              git config user.name "Harness AI Agent"
              git config user.email "harness-ai-agent@users.noreply.github.com"
              git checkout -B ai-game-upgrades
              git add -- "$GAME"
              git commit -m "Add TRIAD v0.6 with AI game upgrades"
              git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/BeeKeeperTK/triadvoxel-html-game.git" ai-game-upgrades
